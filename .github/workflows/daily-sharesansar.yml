name: Daily ShareSansar Data Pull (Sun-Fri)

on:
  schedule:
    # Off-peak minutes (avoiding :00, :15, :30, :45) Sunday-Friday
    # Primary: 4:37 PM NPT (16:37 NPT = 10:52 UTC)
    - cron: '52 10 * * 0-5'
    # Fallback: 5:08 PM NPT (17:08 NPT = 11:23 UTC)
    - cron: '23 11 * * 0-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sharesansar-daily-pull
  cancel-in-progress: false

jobs:
  pull-sharesansar:
    name: Fetch and Update ShareSansar Data
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Pull latest ShareSansar daily share prices
        run: npx tsx scripts/pull-sharesansar.ts

      - name: Commit and push updated data CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --staged --quiet; then
            echo "No new trading day changes to commit."
          else
            git commit -m "chore(data): daily ShareSansar share prices"
            git pull --rebase origin ${{ github.event.repository.default_branch }} || true
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
