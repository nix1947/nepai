name: Daily NEPSE ShareSansar Data Pull

on:
  schedule:
    # 09:45 UTC = 15:30 NPT (Nepal Standard Time, UTC+5:45), Sunday–Thursday (NEPSE trading days)
    - cron: '45 9 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-sharesansar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pull latest ShareSansar daily share prices
        run: npx tsx scripts/pull-sharesansar.ts

      - name: Commit and push updated data CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --staged --quiet; then
            echo "No new trading day changes to commit."
          else
            git commit -m "chore(data): daily NEPSE share prices from ShareSansar"
            git push
          fi
