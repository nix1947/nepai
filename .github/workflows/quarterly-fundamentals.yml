name: Quarterly ShareSansar Fundamental Reports

on:
  schedule:
    # Runs daily at off-peak 17:12 NPT (11:27 UTC) during every Nepal BS upcoming quarter reporting window
    # starting at Quarter-End + 15 days and skipping any company whose quarter data already exists:
    # Upcoming Q2 (Poush end ~Jan 14 -> +15d Jan 29 through Mar 5)
    - cron: '27 11 29-31 1 *'
    - cron: '27 11 1-28 2 *'
    - cron: '27 11 1-5 3 *'
    # Upcoming Q3 (Chaitra end ~Apr 13 -> +15d Apr 28 through Jun 5)
    - cron: '27 11 28-30 4 *'
    - cron: '27 11 1-31 5 *'
    - cron: '27 11 1-5 6 *'
    # Upcoming Q4 / Annual (Ashad end ~Jul 16 -> +15d Jul 31 through Sep 15)
    - cron: '27 11 31 7 *'
    - cron: '27 11 1-31 8 *'
    - cron: '27 11 1-15 9 *'
    # Upcoming Q1 (Ashwin end ~Oct 17 -> +15d Nov 1 through Dec 5)
    - cron: '27 11 1-30 11 *'
    - cron: '27 11 1-5 12 *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Collection mode (due = pending/uncollected for active quarter, top = top turnover missing current quarter, all = full missing equity list)'
        required: false
        default: 'due'
        type: choice
        options:
          - due
          - top
          - all
      limit:
        description: 'Max missing companies to scrape per run (already-populated quarter companies are skipped automatically)'
        required: false
        default: '150'
        type: string
      delay_days:
        description: 'Days after quarter-end before automated collection begins (default 15)'
        required: false
        default: '15'
        type: string
      symbol:
        description: 'Optional single ticker symbol (e.g., NABIL) to refresh'
        required: false
        default: ''
        type: string
      force:
        description: 'Force re-scrape even if quarter data already exists or window is not open yet'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: quarterly-fundamentals-pull
  cancel-in-progress: false

jobs:
  pull-quarterly-fundamentals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Scrape ShareSansar quarterly & annual financial reports (skipping existing quarter data)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'due' }}"
          LIMIT="${{ github.event.inputs.limit || '150' }}"
          DELAY_DAYS="${{ github.event.inputs.delay_days || '15' }}"
          SYMBOL="${{ github.event.inputs.symbol || '' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"

          CMD="npx tsx scripts/pull-fundamentals.ts --mode=${MODE} --limit=${LIMIT} --delay-days=${DELAY_DAYS} --concurrency=3"
          if [ -n "$SYMBOL" ]; then
            CMD="${CMD} --symbol=${SYMBOL}"
          fi
          if [ "$FORCE" = "true" ]; then
            CMD="${CMD} --force"
          fi

          echo "Running: $CMD"
          $CMD

      - name: Crawl & update NEPSE Regulatory Knowledge Base (ICRA, CARE, NRB, NIA, SEBON, NEPSE, CDSC)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SYMBOL="${{ github.event.inputs.symbol || '' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          KB_CMD="npx tsx scripts/harvest-knowledge-base.ts --agencies=ALL --enrich-limit=12"
          if [ -n "$SYMBOL" ]; then
            KB_CMD="${KB_CMD} --symbol=${SYMBOL}"
          fi
          if [ "$FORCE" = "true" ]; then
            KB_CMD="${KB_CMD} --force"
          fi
          echo "Running: $KB_CMD"
          $KB_CMD

      - name: Commit and push updated financial statements, vault ledgers & Regulatory KB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git status --porcelain -- 'data/financial/*.json' 'data/financial/*.csv' 'data/financial/vault/ledgers/*.json' 'data/financial/vault/quarterly_metrics.csv' 'data/financial/vault/regulatory-kb.json' | grep -q .; then
            git add data/financial
            git commit -m "chore(fundamentals): quarterly financial reports & regulatory knowledge base"
            git pull --rebase origin ${{ github.event.repository.default_branch }} || true
            git push origin HEAD:${{ github.event.repository.default_branch }}
          else
            git checkout -- data/financial/vault/monitor-state.json 2>/dev/null || true
            echo "No new quarterly financial statement or KB updates to commit."
          fi
